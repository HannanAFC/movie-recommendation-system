services:

  frontend:
    build: ./
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - movie-recommendation-system
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  backend:
    build: ./api
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - movie-recommendation-system
    volumes:
      - ./api:/app
      - db_data:/app/data/db
      - dataset_data:/app/data/datasets
      - models_data:/app/data/models
    restart: unless-stopped

volumes:
  frontend_node_modules:
  db_data:
  dataset_data:
  models_data:

networks:
  movie-recommendation-system:
    driver: bridge