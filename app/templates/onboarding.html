{% extends "base.html" %}

{% block content %}
 <form action="" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <label for="dataset">Select a dataset:</label>
    <select name="dataset">
        <option value="development">Small (Development)</option>
        <option value="production">Large (Production)</option>
    </select>
    <button type="submit">Select</button>
 </form>
{% endblock %}
