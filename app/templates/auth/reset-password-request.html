{% extends "base.html" %}
{% block content %}
    <form action="" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <label for="email">Email</label>
        <input class="border-black border-2 rounded-sm" type="email" name="email" id="email" required>
        <button type="submit" class="cursor-pointer border-2 border-black p-2 rounded-sm">Request password reset</button>
    </form>
{% endblock %}
